spring.application.name=embedding-pgvector
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/embedding_pgvector}
spring.datasource.username=${POSTGRES_USER:embedding}
spring.datasource.password=${POSTGRES_PASSWORD:embedding-local}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-swallow-size=-1

embedding.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
embedding.model=${EMBEDDING_MODEL:bge-m3}
embedding.dimensions=${EMBEDDING_DIMENSIONS:1024}
embedding.connect-timeout=2s
embedding.read-timeout=60s

search.default-mode=HYBRID
search.default-filter-strategy=ITERATIVE_SCAN
search.default-ef-search=40
search.default-limit=10
search.rrf-k=60
search.max-scan-tuples=20000
search.force-vector-index=true
search.stats-time-zone=Europe/Istanbul
search.popular-query-limit=5
search.popular-max-distance=0.49

ingestion.embedding-batch-size=96
ingestion.target-chunk-chars=1600
ingestion.max-chunk-chars=2000
ingestion.overlap-chars=200
ingestion.chars-per-token=4
ingestion.worker-threads=2
ingestion.queue-capacity=100

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
